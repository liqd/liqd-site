name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Setup Postgres
        env:
          PGPASSWORD: postgres
          PGHOSTADDR: 127.0.0.1
        run: |
          psql -c 'create database django;' -U postgres
          psql -c 'create database django_test;' -U postgres
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Cache pip packages
        uses: actions/cache@v4
        env:
          cache-name: cache-pip-packages
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install Dependencies
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          # If PAT is empty, use GITHUB_TOKEN (for other private org repos, enable access under
          # Organization Settings → Actions → Workflow permissions)
          TOKEN="${PAT:-${{ github.token }}}"
          if [ -z "${TOKEN}" ]; then
            echo "::error::No token available for private git dependencies (neither secrets.PAT nor github.token)."
            exit 1
          fi
          # Auth via credential store (npm/git can drop embedded tokens from rewritten URLs).
          printf 'https://x-access-token:%s@github.com\n' "${TOKEN}" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git config --global credential.helper store
          # Map SSH/SCP-style GitHub URLs to HTTPS; credentials come from ~/.git-credentials above.
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          npm install
          npm run build
          pip install -r requirements/dev.txt
      - name: Run Tests
        env:
          PGPASSWORD: postgres
          PGHOSTADDR: 127.0.0.1
        run: |
          python manage.py collectstatic > /dev/null
          isort --diff -c website_wagtail apps contrib
          python manage.py makemigrations --dry-run --check --noinput
          flake8 website_wagtail apps contrib --exclude migrations,settings
          npm run lint --silent
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          TRAVIS_SSH_SECRET: ${{ secrets.DEPLOY }}
        run: |
          ./scripts/deploy.sh
