{% if item.link %}
    <a href="{{ item.link }}" class="{{ css_prefix }}__link" target="_blank" rel="noopener noreferrer">
        <p class="{{ css_prefix }}__category">{{ item.category }}</p>
        <p class="{{ css_prefix }}__value" id="{{ css_prefix }}-{{ block_uid }}-{{ item_index }}-value">
            <span class="visually-hidden">{{ item.category }}: </span>{{ item.value }}
        </p>
    </a>
{% else %}
    <p class="{{ css_prefix }}__category">{{ item.category }}</p>
    <p class="{{ css_prefix }}__value" id="{{ css_prefix }}-{{ block_uid }}-{{ item_index }}-value">
        <span class="visually-hidden">{{ item.category }}: </span>{{ item.value }}
    </p>
{% endif %}
